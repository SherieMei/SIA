<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEE PRODUCTION — Assets</title>
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="assets.css">
</head>
<body class="bg-gray-50 text-gray-800">

  <div class="app-layout" style="display: flex; min-height: 100vh;">
    <!-- Sidebar -->
    <aside id="sidebar" style="width: 240px; background: #ffffff; border-right: 1px solid #e2e8f0; padding: 20px 16px; flex-shrink: 0;">
      <div style="margin-bottom: 24px; padding-left: 8px;">
        <h2 style="font-size: 16px; font-weight: 700; color: #0f172a; margin: 0; tracking: wide;">BEE PRODUCTION</h2>
        <span style="font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase;">Studio System</span>
      </div>

      <nav id="navlist" style="display: flex; flex-direction: column; gap: 4px;"></nav>

      <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid #f1f5f9; display: flex; align-items: center; gap: 10px;">
        <div id="sideAvatar" style="width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #475569;">JR</div>
        <div>
          <div id="sideName" style="font-size: 13px; font-weight: 600; color: #1e293b;">Jordan Reyes</div>
          <div id="sideRole" style="font-size: 10px; color: #94a3b8; text-transform: uppercase;">Administrator</div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main style="flex: 1; padding: 32px; max-width: 1200px; margin: 0 auto;">
      <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <div id="topTitle" style="font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em;">Assets</div>
        <button onclick="Studio.confirmLogout()" style="background: none; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; color: #475569;">Log out</button>
      </header>

      <div id="pageContent"></div>
    </main>
  </div>

  <script src="assets.js"></script>
</body>
</html>
