<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <script>
    (function () {
      try {
        if (localStorage.getItem('beeTheme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BEE PRODUCTION — Sign In</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="login.css?v=20261009-studio-layout"
  >
</head>


<body
  data-page="login"
  class="page-login"
>

  <div id="loginScreen">
    <div class="interactive-background" aria-hidden="true"></div>

    <button
      type="button"
      class="theme-toggle-btn login-theme-btn"
      id="loginThemeBtn"
      title="Switch to dark mode"
      aria-label="Switch to dark mode"
    >
      🌙
    </button>


    <div class="slate">

      <section class="slate-top" aria-label="BEE Production">
        <div class="brand-orbits" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="slate-top-left">
          <div class="sprockets" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
          <div class="tag">Animation Production &amp; Asset Approval System</div>
          <h1><span>BEE</span><span class="brand-outline">PRODUCTION</span></h1>
          <div class="brand-bars" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
      </section>

      <!-- BODY -->
      <div class="slate-body">

        <!-- LOGIN FORM -->
        <section class="login-form-section">
          <header class="login-welcome"><p class="eyebrow">Welcome back</p><h2>Sign in to your studio</h2><div class="welcome-accent" aria-hidden="true"></div><p>Access your production workspace and continue where you left off.</p></header>


          <!-- FULL NAME -->
          <div
            class="field hidden"
            id="signupNameField"
          >

            <label for="signupName">
              Full name
            </label>

            <input
              id="signupName"
              type="text"
              placeholder="e.g. Leo Cruz"
              autocomplete="name"
            >

          </div>


          <!-- EMAIL -->
          <div class="field">

            <label for="loginEmail">
              Email
            </label>

            <input
              id="loginEmail"
              type="email"
              placeholder="e.g. leo.cruz@beeproduction.studio"
              autocomplete="email"
            >

          </div>


          <!-- PASSWORD -->
          <div class="field">

            <label for="loginPassword">
              Password
            </label>


            <div class="password-wrap">

              <input
                id="loginPassword"
                type="password"
                placeholder="••••••••"
                autocomplete="current-password"
              >


              <button
                type="button"
                class="pw-toggle-btn"
                id="pwToggleBtn"
                title="Show password"
                aria-label="Show password"
              >

                <!-- HIDDEN PASSWORD ICON -->
                <svg
                  class="pw-icon"
                  viewBox="0 0 24 24"
                  width="22"
                  height="22"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  aria-hidden="true"
                >

                  <path
                    d="M3 3L21 21"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                  />

                  <path
                    d="M10.6 5.2C11.1 5.1 11.5 5 12 5C16 5 19.5 7.5 22 12C21.2 13.4 20.3 14.6 19.2 15.6"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />

                  <path
                    d="M6.6 6.6C4.7 7.8 3.2 9.6 2 12C4.5 16.5 8 19 12 19C13.6 19 15.1 18.6 16.4 17.8"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />

                </svg>

              </button>

            </div>

          </div>


          <!-- LOGIN BUTTON -->
          <button
            type="button"
            class="btn btn-primary login-submit-btn"
            id="loginButton"
          >

            <span>
              Enter studio
            </span>

            <span class="button-arrow">
              →
            </span>

          </button>


          <p
            class="login-help-text"
            id="loginHelpText"
          >
            Sign in using your registered account to continue.
          </p>


        </section>




      </div>

    </div>

  </div>


  <!-- TOAST -->
  <div
    id="toastWrap"
    aria-live="polite"
    aria-atomic="true"
  ></div>


  <script type="module" src="../js/firebase.js"></script>
  <script src="../js/shared.js?v=20261008-api-base-v1"></script>
  <script src="login.js?v=20261009-studio-layout"></script>

</body>

</html>
